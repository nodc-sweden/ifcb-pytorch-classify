[project]
name = "ifcb-classify"
version = "0.4.0"
description = "Pipeline for IFCB image classification using PyTorch"
requires-python = ">=3.11,<3.15"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "torcheval>=0.0.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "h5py>=3.9",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "plotly>=5.0",
    "ifcbkit @ git+https://github.com/WHOIGit/ifcbkit@v0.2.1",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.0"]
wandb = ["wandb>=0.15"]
chains = ["ultralytics>=8.3", "requests>=2.28"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "ruff>=0.1",
]

[project.scripts]
ifcb-classify = "ifcb_classify.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ifcb_classify"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly: ruff's implicit default changed under us once (0.16 went
# from 59 rules to 413), so the set is named here and widened deliberately.
# N is omitted on purpose: N812 rejects `import torch.nn.functional as F`.
# PL/ARG/D are omitted as too noisy for this codebase.
select = [
    "E4", "E7", "E9",  # pycodestyle (subset)
    "F",               # pyflakes
    "I",               # isort
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "C4",              # flake8-comprehensions
    "SIM",             # flake8-simplify
    "PIE",             # flake8-pie
    "PT",              # flake8-pytest-style
    "FURB",            # refurb
    "RUF",             # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that download model weights",
]

[tool.coverage.run]
source = ["src/ifcb_classify"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
