name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref: a constant group here would make concurrent PRs cancel each
# other's docs build. Serialising the actual Pages deployment is the deploy
# job's concern, not the whole workflow's.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Create virtual environment
        run: uv venv --python 3.12

      - name: Install docs dependencies
        # mkdocstrings reads the source statically (griffe), so the package's
        # heavy runtime deps (torch, pyifcb) are not needed to build the docs.
        run: >
          uv pip install
          mkdocs
          mkdocs-material
          "mkdocstrings[python]"
          mkdocs-gen-files
          mkdocs-literate-nav
          mkdocs-section-index
          ruff

      - name: Build site
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: uv run mkdocs build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Only publish from the default branch.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Allow one concurrent deployment; never cancel one mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
