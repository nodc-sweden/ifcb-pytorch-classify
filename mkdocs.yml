site_name: IFCB Classify
site_description: Pipeline for IFCB image classification using PyTorch
site_url: https://nodc-sweden.github.io/ifcb-pytorch-classify/
repo_url: https://github.com/nodc-sweden/ifcb-pytorch-classify
repo_name: nodc-sweden/ifcb-pytorch-classify
edit_uri: edit/main/docs/

# Reload the API reference when docstrings change.
watch:
  - src/ifcb_classify

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Installation: installation.md
  - Concepts & glossary: concepts.md
  - Guides:
      - Training: guides/training.md
      - Inference: guides/inference.md
      - Chain counting: guides/chain-counting.md
      - Chain-counting annotation: guides/chain-counting-annotation.md
  - Configuration: configuration.md
  - API reference: reference/

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]
            # Render a linked summary table of submodules/members, so the
            # package landing page (empty __init__) is a useful index.
            summary: true
            show_submodules: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true
