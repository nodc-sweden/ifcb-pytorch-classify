site_name: IFCB Classify
site_description: Pipeline for IFCB image classification using PyTorch
site_url: https://nodc-sweden.github.io/ifcb-pytorch-classify/
repo_url: https://github.com/nodc-sweden/ifcb-pytorch-classify
repo_name: nodc-sweden/ifcb-pytorch-classify
edit_uri: edit/main/docs/

# README is reused as the home page (docs/index.md), so reload on its changes.
watch:
  - README.md
  - src/ifcb_classify

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# README is reused as the home page; its links point at repo files (scripts/,
# LICENSE) rather than doc pages, so don't fail the build over them.
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Home: index.md
  - Guides:
      - Chain-counting annotation: chain-counting-annotation.md
  - API reference: reference/

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true
